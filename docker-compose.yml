# MD Simulator. In Portainer: Stacks → Add stack → Repository, compose path "docker-compose.yml".
# AI is optional: leave ANTHROPIC_API_KEY empty and everything that doesn't need AI still works.
services:
  mdsim:
    build: .
    image: mdsimulator:local
    container_name: mdsimulator
    restart: unless-stopped
    ports:
      - "${MDSIM_PORT:-8080}:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MDSIM_PASSCODE: ${MDSIM_PASSCODE:-}
      MDSIM_DAILY_LIMIT: ${MDSIM_DAILY_LIMIT:-300}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
